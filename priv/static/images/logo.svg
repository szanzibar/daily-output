<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160">
  <!-- Blue background band -->
  <rect width="800" height="160" fill="#2563eb"/>

  <!-- Bold black border -->
  <rect x="4" y="4" width="792" height="152" fill="none" stroke="#1a1a2e" stroke-width="8"/>

  <!-- Yellow accent block behind "OUTPUT" -->
  <rect x="340" y="4" width="456" height="152" fill="#facc15"/>
  <rect x="340" y="4" width="456" height="152" fill="none" stroke="#1a1a2e" stroke-width="8"/>

  <!-- "DAILY" text — white on blue -->
  <text x="20" y="118" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="120" fill="#f5f5f0" letter-spacing="2">DAILY</text>

  <!-- "OUTPUT" text — ink/black on yellow -->
  <text x="360" y="116" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="84" fill="#1a1a2e" letter-spacing="12">OUTPUT</text>

  <!-- Horizontal brutalist accent line under DAILY -->
  <rect x="20" y="130" width="305" height="5" fill="#facc15"/>

  <!-- Small "DO" monogram mark at top-left -->
  <rect x="12" y="10" width="40" height="40" fill="#facc15" stroke="#1a1a2e" stroke-width="3"/>
  <text x="14" y="40" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#1a1a2e">DO</text>
</svg>
