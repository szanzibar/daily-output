<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: electric blue -->
  <rect width="512" height="512" fill="#2563eb"/>

  <!-- Bold border -->
  <rect x="8" y="8" width="496" height="496" fill="none" stroke="#000" stroke-width="16"/>

  <!-- "S" letter — big, bold, brutalist -->
  <text x="80" y="340" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="360" fill="#fff" letter-spacing="-20">S</text>

  <!-- Yellow accent block behind "J" -->
  <rect x="260" y="120" width="200" height="280" fill="#ffd700"/>
  <rect x="260" y="120" width="200" height="280" fill="none" stroke="#000" stroke-width="8"/>

  <!-- "J" letter -->
  <text x="280" y="340" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="280" fill="#000" letter-spacing="-10">J</text>

  <!-- Red correction line — the proofreading motif -->
  <line x1="60" y1="380" x2="452" y2="380" stroke="#ef4444" stroke-width="12"/>
  <line x1="60" y1="380" x2="452" y2="380" stroke="#ef4444" stroke-width="4" stroke-dasharray="none"/>

  <!-- Small green correction text -->
  <text x="80" y="440" font-family="Courier New, monospace" font-weight="700" font-size="48" fill="#22c55e" font-style="italic">schreib.</text>

  <!-- Pencil/edit mark -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-weight="900" font-size="60" fill="#fff">✎</text>
</svg>
