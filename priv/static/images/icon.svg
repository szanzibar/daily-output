<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Blue background block -->
  <rect width="512" height="512" fill="#2563eb"/>

  <!-- Bold black border -->
  <rect x="8" y="8" width="496" height="496" fill="none" stroke="#1a1a2e" stroke-width="16"/>

  <!-- Yellow accent block — bottom-right quadrant -->
  <rect x="256" y="256" width="248" height="248" fill="#facc15"/>
  <rect x="256" y="256" width="248" height="248" fill="none" stroke="#1a1a2e" stroke-width="8"/>

  <!-- "D" letter — bold, left side -->
  <text x="40" y="370" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="380" fill="#f5f5f0" letter-spacing="-25">D</text>

  <!-- "O" letter — bold, right side, overlapping yellow block -->
  <text x="250" y="370" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="380" fill="#1a1a2e" letter-spacing="-25">O</text>

  <!-- Horizontal rule — brutalist accent line -->
  <rect x="32" y="400" width="448" height="12" fill="#facc15"/>
  <rect x="32" y="400" width="448" height="12" fill="none" stroke="#1a1a2e" stroke-width="3"/>

  <!-- Small "daily output" micro-text below the line -->
  <text x="40" y="468" font-family="'Courier New', monospace" font-weight="700" font-size="42" fill="#f5f5f0" letter-spacing="6">DAILY</text>
  <text x="270" y="468" font-family="'Courier New', monospace" font-weight="700" font-size="42" fill="#1a1a2e" letter-spacing="6">OUTPUT</text>
</svg>
