services:
  sprachjournal:
    build: .
    ports:
      - "4000:4000"
    environment:
      - DATABASE_PATH=/app/data/sprachjournal.db
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PHX_HOST=${PHX_HOST:-localhost}
      - PHX_SERVER=true
      - PORT=4000
    volumes:
      - sprachjournal_data:/app/data
    restart: unless-stopped

volumes:
  sprachjournal_data:
