services:
  sprachjournal:
    build: .
    ports:
      - '46142:4000'
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/sprachjournal.db
      - PHX_SERVER=true
      - PORT=4000
    volumes:
      - sprachjournal_data:/app/data
    restart: unless-stopped

volumes:
  sprachjournal_data:
